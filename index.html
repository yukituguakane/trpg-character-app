<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨニンコンバータCS</title>
<style>
:root{--bg:#f5f4f1;--panel:#fff;--ink:#252525;--muted:#777;--line:#dedbd4;--soft:#eeece7;--accent:#555}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}.app{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.brand{font-size:20px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn,.tab,.mode button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 13px;cursor:pointer}.btn:hover,.tab:hover,.mode button:hover{background:var(--soft)}.mode{display:flex;background:var(--soft);padding:3px;border-radius:10px}.mode button{border:0;background:transparent}.mode .active,.tab.active,.navpage.active{background:white;font-weight:700;box-shadow:0 1px 3px #0001}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px}.name{font-size:28px;font-weight:800}.meta,.small,.action-meta{color:var(--muted);font-size:13px}.personal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.field,.skillgroup,.action,.memory,.char-card{border:1px solid var(--line);border-radius:9px;padding:10px}.label{font-size:12px;color:var(--muted)}.value{font-weight:600}.full{grid-column:1/-1}.tabs{display:flex;gap:4px;margin:12px 0 0}.tab{border-radius:10px 10px 0 0;background:var(--soft);padding:11px 25px}.grid{display:grid;grid-template-columns:1.35fr .9fr;gap:14px}.skills{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.skilllist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.skill{background:var(--soft);border-radius:999px;padding:5px 9px;font-size:13px}.alist{display:grid;gap:9px}.ahead{display:flex;gap:7px;align-items:center}.aname{font-weight:800;flex:1}.badge{font-size:11px;background:var(--soft);padding:4px 7px;border-radius:999px}.locked{background:#f3f2ef;color:#999}.effect{margin-top:7px;line-height:1.5}.habits{display:grid}.habit{padding:8px;border-bottom:1px solid var(--line)}.guest{display:grid;grid-template-columns:1fr 1fr;padding:9px 0;border-bottom:1px solid var(--line)}.stress{font-size:30px;font-weight:800}.memorygrid,.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.memory h3{margin:0 0 8px}.memo{margin-top:9px;line-height:1.5}.who{font-size:13px;color:var(--muted)}.gm{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hidden{display:none!important}.char-card{cursor:pointer;background:white}.char-card:hover{background:var(--soft)}.char-card.selected{outline:2px solid #999}.char-card h3{margin:0 0 5px}.char-card .role{font-size:12px;color:var(--muted)}.char-select-actions{display:flex;gap:8px;margin-top:12px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edit-field{display:flex;flex-direction:column;gap:5px}.edit-field.full{grid-column:1/-1}.edit-field input,.edit-field select,.edit-field textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:9px;background:white}.edit-field textarea{min-height:70px;resize:vertical}.free-memo-view{white-space:pre-wrap;line-height:1.7;min-height:80px}.free-memo-textarea{min-height:140px;resize:vertical;overflow-y:hidden;line-height:1.6}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.savebar{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.save{background:#252525;color:white;border-color:#252525}.skill-editor{display:grid;gap:8px}.skill-row,.guest-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px;align-items:center}.action-editor{display:flex;flex-direction:column;gap:14px}.action-slot{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px #0000000a}.action-slot.locked{background:#f3f2ef}.slot-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:7px}.action-slot.locked{background:#f3f2ef;color:#999}.action-slot.locked input,.action-slot.locked textarea{background:#e8e6e1}.action-edit-row{display:grid;grid-template-columns:1fr 110px 90px;gap:7px}.action-edit-row input,.skill-row input,.skill-row select,.guest-row input,.guest-row select{width:100%;font:inherit;border:1px solid var(--line);border-radius:7px;padding:7px}.danger{color:#7a3333}.notice{padding:10px;background:var(--soft);border-radius:9px;font-size:13px}.memory-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.memory-form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.memory-form .full{grid-column:1/-1}.emotion-list{display:grid;gap:8px}.emotion-card{border:1px solid var(--line);border-radius:9px;padding:10px}.emotion-card .emotion-meta{font-size:13px;color:var(--muted)}.memory-count{font-size:12px;color:var(--muted);margin-top:7px}.selection-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.selection-actions{display:flex;gap:8px;flex-wrap:wrap}.check{font-size:16px;color:var(--ink)}.memory-owner-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:9px;border:1px solid var(--line);border-radius:8px;background:white}.memory-owner-item{display:flex;align-items:center;justify-content:flex-start;gap:8px;min-width:0;width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--soft);cursor:pointer;line-height:1.4}.memory-owner-item input{display:block;flex:0 0 auto;width:18px;height:18px;margin:0}.memory-owner-name{display:block;min-width:0;flex:1;overflow-wrap:anywhere;word-break:break-word;white-space:normal}.memory-owner-item:hover{background:white}@media(max-width:760px){.memory-owner-list{grid-template-columns:1fr}}
@media(max-width:760px){.app{padding:12px}.top{display:grid}.actions{display:grid;grid-template-columns:1fr 1fr}.mode{grid-column:1/-1}.grid,.gm{grid-template-columns:1fr}.personal,.skills,.memorygrid,.char-grid,.edit-grid{grid-template-columns:1fr}.edit-field.full{grid-column:auto}.name{font-size:23px}.tab{flex:1}.action-edit-row{grid-template-columns:1fr}.skill-row,.guest-row{grid-template-columns:1fr}.char-select-actions{flex-direction:column}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">ヨニンコンバータCS</div>
  <div class="actions">
    <div class="mode"><button type="button" id="view" class="active">閲覧</button><button type="button" id="edit">編集</button></div>
    <button type="button" class="btn navpage active" data-page="select">PLキャラクター選択</button>
    <button type="button" class="btn navpage" data-page="char">キャラクター</button>
    <button type="button" class="btn navpage" data-page="mem">思い出の品</button>
    <button type="button" class="btn navpage" data-page="gm">GM画面</button>
  </div>
</header>

<main id="select">
  <section class="card">
    <div class="selection-head"><div><h2 style="margin:0 0 5px">PLキャラクター選択</h2><div class="small">自分が操作するキャラクターを選択します。選択中のキャラクターはキャラクター画面・編集画面・思い出の品で共通して使用されます。</div></div></div>
  </section>
  <div id="characterCards" class="char-grid"></div>
</main>

<main id="char" class="hidden">
  <section class="card">
    <div class="name" id="charName"></div><div class="meta" id="charMeta"></div>
    <div id="pv" class="personal"></div>
    <div id="pe" class="hidden"></div>
    <div id="pairLevelsSection"></div><div id="feelingsSection"></div>
  </section>
  <div class="tabs"><button type="button" id="dt" class="tab active">探偵</button><button type="button" id="at" class="tab">助手</button></div>
  <section id="dv"></section><section id="av" class="hidden"></section>
  <section id="freeMemoSection"></section>
</main>

<main id="mem" class="hidden">
  <section class="card">
    <div class="section-title"><div><h2 style="margin:0 0 5px">思い出の品</h2><div class="small">思い出の品1つにつき、複数の「取得者」を登録します。ペアレベルは取得者から自動計算されます。</div></div><button type="button" class="btn save" id="addMemory">＋思い出の品を追加</button></div>
    <div id="memoryForm" class="card hidden" style="margin:12px 0 0;background:var(--soft)"></div>
  </section>
  <div id="memoryGrid" class="memorygrid"></div>
</main>

<main id="gm" class="hidden">
  <section class="card"><h2>今回のセッション</h2><div class="personal">
    <label class="edit-field">探偵<select id="gmDetective"></select></label>
    <label class="edit-field">助手<select id="gmAssistant"></select></label>
  </div><div class="small" style="margin-top:10px">キャラクターを変更すると、下のGM表示も自動で切り替わります。</div></section>
  <div class="gm"><section class="card"><h2 id="gmDetectiveTitle"></h2><p id="gmDetectiveLevel" class="small"></p><b>技能</b><p id="gmDetectiveSkills"></p><b>アクション</b><p id="gmDetectiveActions"></p><b>異常な癖</b><p id="gmDetectiveHabits"></p></section>
  <section class="card"><h2 id="gmAssistantTitle"></h2><p id="gmAssistantLevel" class="small"></p><b>心労</b><p id="gmAssistantStress"></p><b>技能</b><p id="gmAssistantSkills"></p><b>アクション</b><p id="gmAssistantActions"></p><b>ゲスト</b><p id="gmAssistantGuests"></p></section></div>
</main>
</div>

<script>
const MAX_PAIR_LEVEL=7;
const UNLOCK_LEVELS=[0,0,2,5,7];
const state={selectedCharacterId:'Kyoshiro',role:'d',mode:'view',page:'select',gmDetective:'Kyoshiro',gmAssistant:'Alice',editDraft:null};

// Empty character templates. Character IDs are fixed to the production identifiers until the app is connected to persistent storage.
const blankAction=()=>({name:'',type:'',cost:'',effect:'',ref:''});
const characters={};
for(const [id,number] of [['Kyoshiro',1],['Alice',2],['Retasu',3],['Raika',4]]){
  characters[id]={
    id, name:'', className:'', age:'', gender:'', likes:'', dislikes:'', fashion:'',
    strongFeelings:[],
    classSkillRules:{fixed:[],categoryChoices:[],freeChoices:0},
    commonSkills:{class:[],growth:[]},
    detective:{actionSkills:[],actions:[blankAction(),blankAction()],habits:['','','','','','']},
    assistant:{actionSkills:[],actions:[blankAction(),blankAction()],guestSkills:[],stress:0,guests:[]}};
}

// Start with no sample memory items. Memories can be added by users later.
const memories=[];

const $=id=>document.getElementById(id);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clone(v){return JSON.parse(JSON.stringify(v));}
function pairKey(a,b){return [a,b].sort().join(':');}
function pairLevel(a,b){
  if(a===b)return 0;
  return Math.min(MAX_PAIR_LEVEL, memories.filter(m=>m.owners.includes(a)&&m.owners.includes(b)).length);}
function maxPairLevelForCharacter(id){
  return Math.max(0,...Object.keys(characters).filter(other=>other!==id).map(other=>pairLevel(id,other)));}
function memoryCountForCharacter(id){return memories.filter(m=>m.owners.includes(id)).length;}
function slotUnlocked(index,level){return level>=UNLOCK_LEVELS[index];}
function maxUnlockedActions(level){return Math.min(UNLOCK_LEVELS.length, UNLOCK_LEVELS.filter(x=>x<=Math.min(MAX_PAIR_LEVEL,level)).length);}
function selectedPair(){return {a:state.gmDetective,b:state.gmAssistant,level:pairLevel(state.gmDetective,state.gmAssistant)};}

function setPage(page){
  state.page=page;
  ['select','char','mem','gm'].forEach(id=>$(id).classList.toggle('hidden',id!==page));
  document.querySelectorAll('.navpage').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  if(page==='char')renderCharacter();
  if(page==='mem')renderMemories();
  if(page==='gm'){fillGMSelects();updateGM();}
}
function setRole(role){
  state.role=role;
  $('dv').classList.toggle('hidden',role!=='d');
  $('av').classList.toggle('hidden',role!=='a');
  $('dt').classList.toggle('active',role==='d');
  $('at').classList.toggle('active',role==='a');
  renderRole();}
function beginEdit(){
  state.editDraft=clone(characters[state.selectedCharacterId]);
  state.mode='edit';
  $('view').classList.remove('active');$('edit').classList.add('active');
  renderCharacter();}
function cancelEdit(){
  state.editDraft=null;
  state.mode='view';
  $('edit').classList.remove('active');$('view').classList.add('active');
  renderCharacter();}
function setMode(mode){if(mode==='edit'){beginEdit();}else{cancelEdit();}}
function currentCharacter(){return state.mode==='edit'&&state.editDraft?state.editDraft:characters[state.selectedCharacterId];}
function renderSelection(){
  $('characterCards').innerHTML=Object.values(characters).map(c=>`<article class="char-card ${c.id===state.selectedCharacterId?'selected':''}" data-char-id="${c.id}"><h3>${esc(c.name||'未登録のキャラクター')}</h3><div class="role">${esc(c.className||'クラス未設定')} / ${esc(c.gender||'性別未設定')}</div><div class="small">ID: ${esc(c.id)}</div><div class="memory-count">思い出の品：${memoryCountForCharacter(c.id)}個</div><div class="char-select-actions"><button type="button" class="btn choose-char" data-char-id="${c.id}">${c.id===state.selectedCharacterId?'選択中':'このキャラクターを選択'}</button></div></article>`).join('');
  document.querySelectorAll('.choose-char').forEach(b=>b.addEventListener('click',()=>{state.selectedCharacterId=b.dataset.charId;state.editDraft=null;state.mode='view';setPage('char');renderSelection();}));}
function renderPersonal(){
  const c=currentCharacter();
  $('charName').textContent=c.name||'未登録のキャラクター';
  $('charMeta').textContent=`クラス：${c.className||'未設定'}　｜　キャラクターID：${c.id}`;
  if(state.mode==='view'){
    $('pv').className='personal';
    $('pv').innerHTML=`<div class="field"><div class="label">年齢</div><div class="value">${esc(c.age||'—')}</div></div><div class="field"><div class="label">性別</div><div class="value">${esc(c.gender||'—')}</div></div><div class="field"><div class="label">好きなもの</div><div class="value">${esc(c.likes||'—')}</div></div><div class="field"><div class="label">嫌いなもの</div><div class="value">${esc(c.dislikes||'—')}</div></div><div class="field full"><div class="label">ファッション特徴</div><div class="value">${esc(c.fashion||'—')}</div></div>`;
    $('pe').classList.add('hidden');$('pv').classList.remove('hidden');
  }else{
    $('pv').classList.add('hidden');$('pe').classList.remove('hidden');
  $('pe').innerHTML=`<div class="edit-grid"><label class="edit-field"><span class="label">名前</span><input data-personal="name" value="${esc(c.name)}"></label><label class="edit-field">
  <span class="label">クラス</span>
  <input data-personal="className"
         value="${esc(c.className)}">
</label><label class="edit-field"><span class="label">年齢</span><input data-personal="age" value="${esc(c.age)}"></label><label class="edit-field"><span class="label">性別</span><input data-personal="gender" value="${esc(c.gender)}"></label><label class="edit-field"><span class="label">好きなもの</span><input data-personal="likes" value="${esc(c.likes)}"></label><label class="edit-field"><span class="label">嫌いなもの</span><input data-personal="dislikes" value="${esc(c.dislikes)}"></label><label class="edit-field full"><span class="label">ファッション特徴</span><input data-personal="fashion" value="${esc(c.fashion)}"></label></div><div class="savebar"><button type="button" class="btn" id="cancelPersonal">キャンセル</button></div>`;
    $('cancelPersonal').addEventListener('click',cancelEdit); }
$('savePersonal').addEventListener('click', async () => {
  const saveButton = $('savePersonal');
  const password = prompt('キャラクターのパスワードを入力してください。');

if (password === null) {
  // キャンセルされた場合
  return;}
if (password.trim().length === 0) {
  alert('パスワードが入力されていません。入力してから再度保存してください。');
  return;}
  const updated = clone(c);
  document.querySelectorAll('[data-personal]').forEach(el => {updated[el.dataset.personal] = el.value;});
  saveButton.disabled = true;
  saveButton.textContent = '保存中…';
  try {const response = await fetch(`${API_BASE}/api/characters/${encodeURIComponent(updated.id)}`,
      {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password,sheet: updated})});
    const result = await response.json();
    if (!response.ok || !result.ok) {
      throw new Error(result.error || '保存に失敗しました。');}
    characters[state.selectedCharacterId] = updated;
    state.editDraft = null;
    state.mode = 'view';
    $('edit').classList.remove('active');
    $('view').classList.add('active');
    renderSelection();
    renderCharacter();
    alert('保存しました！');} catch (error) {console.error('Character save failed:', error);
    alert(error.message || '保存に失敗しました。入力内容を確認して再試行してください。');}finally {saveButton.disabled = false;saveButton.textContent = '保存';}});
    $('cancelPersonal').addEventListener('click',cancelEdit); }
  renderPairLevels(c);
  renderStrongFeelings(c);}
function renderPairLevels(c){
  const host=$('pairLevelsSection');
  const others=Object.values(characters).filter(x=>x.id!==c.id);
  host.innerHTML=`<div class="card" style="margin-top:16px"><div class="section-title"><h3 style="margin:0">ペアレベル</h3><span class="small">思い出の品から自動計算</span></div><div class="personal" style="margin-top:10px">${others.map(o=>{const level=pairLevel(c.id,o.id);return `<div class="field"><div class="label">誰と</div><div class="value">${esc(o.name)}</div><div class="small" style="margin-top:4px">Lv${level}</div></div>`}).join('')}</div><div class="small" style="margin-top:10px">このレベルは、2人のどちらも取得者になっている思い出の品の数です。全員が取得した品も、その全員のペアに加算されます。</div></div>`;
}
function renderStrongFeelings(c){
  const host=$('feelingsSection');
  if(state.mode==='view'){
    host.innerHTML=`<div style="margin-top:16px"><div class="section-title"><h3 style="margin:0">強い感情</h3><span class="small">ロール共通</span></div><div class="emotion-list" style="margin-top:8px">${c.strongFeelings.length?[...c.strongFeelings].sort((a,b)=>(characters[a.who]?.name||a.who).localeCompare(characters[b.who]?.name||b.who,'ja')).map(f=>`<div class="emotion-card"><div class="emotion-meta">${esc(characters[f.who]?.name||f.who)} ／ ${f.kind==='like'?'気に入っているところ':'気に入らないところ'}</div><b>${esc(f.emotion)}</b></div>`).join(''):'<div class="small">まだ登録されていません。</div>'}</div></div>`;
  }else{
    host.innerHTML=`<div class="card" style="margin-top:16px;background:var(--soft)"><div class="section-title"><h3 style="margin:0">強い感情（ロール共通）</h3><button type="button" class="btn add-feeling">＋追加</button></div><div class="emotion-list" style="margin-top:10px">${c.strongFeelings.map((f,i)=>({f,i})).sort((a,b)=>(characters[a.f.who]?.name||a.f.who).localeCompare(characters[b.f.who]?.name||b.f.who,'ja')).map(({f,i})=>`<div class="emotion-card"><div class="edit-grid"><label class="edit-field"><span class="label">誰と</span><select data-feeling-index="${i}" data-feeling-key="who">${Object.values(characters).filter(x=>x.id!==state.selectedCharacterId).sort((a,b)=>a.name.localeCompare(b.name,'ja')).map(x=>`<option value="${x.id}" ${x.id===f.who?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="edit-field"><span class="label">気に入っている／気に入らない</span><select data-feeling-index="${i}" data-feeling-key="kind"><option value="like" ${f.kind==='like'?'selected':''}>気に入っているところ</option><option value="dislike" ${f.kind==='dislike'?'selected':''}>気に入らないところ</option></select></label><label class="edit-field full"><span class="label">感情の名前</span><input data-feeling-index="${i}" data-feeling-key="emotion" value="${esc(f.emotion)}"></label></div><div class="savebar"><button type="button" class="btn remove-feeling" data-feeling-index="${i}">削除</button></div></div>`).join('')||'<div class="small">まだ登録されていません。「＋追加」から登録できます。</div>'}</div><div class="savebar"><button type="button" class="btn" id="cancelFeelings">キャンセル</button><button type="button" class="btn save" id="saveFeelings">保存</button></div></div>`;
    host.querySelectorAll('.add-feeling').forEach(b=>b.addEventListener('click',()=>{syncFeelingsFromDOM();state.editDraft.strongFeelings.push({who:Object.keys(characters).find(id=>id!==state.selectedCharacterId)||'Kyoshiro',kind:'like',emotion:''});renderStrongFeelings(state.editDraft);}));
    host.querySelectorAll('.remove-feeling').forEach(b=>b.addEventListener('click',()=>{syncFeelingsFromDOM();state.editDraft.strongFeelings.splice(Number(b.dataset.feelingIndex),1);renderStrongFeelings(state.editDraft);}));
    $('cancelFeelings').addEventListener('click',cancelEdit);
    $('saveFeelings').addEventListener('click',()=>{syncFeelingsFromDOM();characters[state.selectedCharacterId]=clone(state.editDraft);state.editDraft=null;state.mode='view';$('edit').classList.remove('active');$('view').classList.add('active');renderSelection();renderCharacter();});
  }
}
function syncFeelingsFromDOM(){
  if(!state.editDraft)return;
  $('feelingsSection').querySelectorAll('[data-feeling-index]').forEach(el=>{const i=Number(el.dataset.feelingIndex),key=el.dataset.feelingKey;if(state.editDraft.strongFeelings[i])state.editDraft.strongFeelings[i][key]=el.value;});
}
function growthSkillName(skill){return typeof skill==='string'?skill:(skill?.name||'');}
function growthSkillLevel(skill){return 3;}
function actionSkillName(skill){return typeof skill==='string'?skill:(skill?.name||'');}
function actionSkillLevel(skill){return typeof skill==='string'?0:(Number(skill?.level)||0);}
function visibleGrowthSkills(list,level){return (list||[]).slice(0,1).filter(s=>growthSkillName(s)&&level>=3);}
function visibleActionSkills(list,level){return (list||[]).filter(s=>actionSkillName(s)&&actionSkillLevel(s)<=level);}
function skillGroupsHTML(c,level){
  const actionSkills=state.role==='d'?c.detective.actionSkills:c.assistant.actionSkills;
  const groups=[['class','クラス',c.commonSkills.class],['action','アクション',visibleActionSkills(actionSkills,level)],['growth','成長',visibleGrowthSkills(c.commonSkills.growth,level)]];

}

function actionHTML(list,level){

function syncDraftFromDOM(root){
  const c=state.editDraft;
  root.querySelectorAll('.skill-row input[data-skill-cat][data-skill-index]').forEach(el=>{
    const cat=el.dataset.skillCat,i=Number(el.dataset.skillIndex);

    if(list[i]!==undefined){
      if(cat==='growth'){list[i]={name:el.value,level:3};}
      else if(cat==='action'){const row=el.closest('.skill-row');const lv=row.querySelector('select[data-skill-cat="action"]');list[i]={name:el.value,level:Number(lv?.value)||0};}
      else list[i]=el.value;}});
  const r=state.role==='d'?c.detective:c.assistant;
  root.querySelectorAll('[data-action-index]').forEach(el=>{const i=Number(el.dataset.actionIndex),key=el.dataset.actionKey;if(!r.actions[i])r.actions[i]={name:'',type:'',cost:'',effect:'',ref:''};r.actions[i][key]=el.value;});
  if(state.role==='d') root.querySelectorAll('[data-habit-index]').forEach(el=>r.habits[Number(el.dataset.habitIndex)]=el.value);
  else {
    const stress=root.querySelector('[data-stress]'); if(stress)r.stress=Number(stress.value)||0;
    root.querySelectorAll('[data-guest-index]').forEach(el=>{r.guests[Number(el.dataset.guestIndex)][el.dataset.guestKey]=el.value;});
    r.guestSkills=r.guests.map(g=>g.skill);}
}
function attachEditHandlers(){
  const root=state.role==='d'?$('dv'):$('av');
  root.querySelectorAll('.add-skill').forEach(b=>b.addEventListener('click',()=>{
    syncDraftFromDOM(root);
    const c=state.editDraft,cat=b.dataset.skillCat;
    if(cat==='class')c.commonSkills.class.push('新しい技能');
    else if(cat==='growth'){if(c.commonSkills.growth.length===0)c.commonSkills.growth.push({name:'新しい技能',level:3});}
    else if(cat==='action')(state.role==='d'?c.detective.actionSkills:c.assistant.actionSkills).push({name:'新しい技能',level:0});
    renderRole();
  }));
  root.querySelectorAll('.remove-skill').forEach(b=>b.addEventListener('click',()=>{
    syncDraftFromDOM(root);
    const c=state.editDraft,cat=b.dataset.skillCat,i=Number(b.dataset.skillIndex);
    const list=cat==='class'?c.commonSkills.class:cat==='growth'?c.commonSkills.growth:cat==='action'?(state.role==='d'?c.detective.actionSkills:c.assistant.actionSkills):null;
    list.splice(i,1);renderRole();
  }));
  root.querySelectorAll('.add-guest').forEach(b=>b.addEventListener('click',()=>{syncDraftFromDOM(root);state.editDraft.assistant.guests.push({name:'新しいゲスト',skill:'技能'});renderRole();}));
  root.querySelectorAll('.remove-guest').forEach(b=>b.addEventListener('click',()=>{syncDraftFromDOM(root);const i=Number(b.dataset.guestIndex);state.editDraft.assistant.guests.splice(i,1);renderRole();}));
  $('cancelRole').addEventListener('click',cancelEdit);
  $('saveRole').addEventListener('click',()=>{
    syncDraftFromDOM(root);
    const c=state.editDraft,r=state.role==='d'?c.detective:c.assistant;
    // 技能の重複チェック：アクション技能を含む全取得技能を対象にする。
    // 編集対象自身との比較は除外し、同じ技能名が別の取得枠に存在する場合だけ警告する。
    const skillEntries=[];
    (c.commonSkills.class||[]).forEach((s,i)=>skillEntries.push({name:String(s||''),cat:'class',index:i}));
    (c.commonSkills.growth||[]).forEach((s,i)=>skillEntries.push({name:growthSkillName(s),cat:'growth',index:i}));
    (c.detective.actionSkills||[]).forEach((s,i)=>skillEntries.push({name:actionSkillName(s),cat:'detectiveAction',index:i}));
    (c.assistant.actionSkills||[]).forEach((s,i)=>skillEntries.push({name:actionSkillName(s),cat:'assistantAction',index:i}));
    (c.assistant.guests||[]).forEach((g,i)=>skillEntries.push({name:String(g?.skill||''),cat:'guest',index:i}));
    const duplicate=skillEntries.find((entry,i)=>entry.name && skillEntries.some((other,j)=>j!==i && other.name===entry.name));
    if(duplicate){
      alert(`「${duplicate.name}」がすでに取得している技能と重複しています。別の技能を選択してください。`);
      return;}
    root.querySelectorAll('.skill-row input[data-skill-cat][data-skill-index]').forEach(el=>{
      const cat=el.dataset.skillCat,i=Number(el.dataset.skillIndex);
      const list=cat==='class'?c.commonSkills.class:cat==='growth'?c.commonSkills.growth:cat==='action'?(state.role==='d'?c.detective.actionSkills:c.assistant.actionSkills):null;
      if(list[i]!==undefined){
        if(cat==='growth')list[i]={name:el.value,level:3};
        else if(cat==='action'){const row=el.closest('.skill-row');const lv=row.querySelector('select[data-skill-cat="action"]');list[i]={name:el.value,level:Number(lv?.value)||0};}
        else list[i]=el.value;}
    });
    if(state.role==='d'){
      root.querySelectorAll('[data-habit-index]').forEach(el=>r.habits[Number(el.dataset.habitIndex)]=el.value);
    }else{
      r.stress=Number(document.querySelector('[data-stress]').value)||0;
      root.querySelectorAll('[data-guest-index]').forEach(el=>{r.guests[Number(el.dataset.guestIndex)][el.dataset.guestKey]=el.value;});
      r.guestSkills=r.guests.map(g=>g.skill);}
    root.querySelectorAll('[data-action-index]').forEach(el=>{const i=Number(el.dataset.actionIndex),key=el.dataset.actionKey;if(!r.actions[i])r.actions[i]={name:'',type:'',cost:'',effect:'',ref:''};r.actions[i][key]=el.value;});
    characters[state.selectedCharacterId]=clone(c);
    state.editDraft=null;state.mode='view';$('edit').classList.remove('active');$('view').classList.add('active');renderSelection();renderCharacter();
  });
}

  $('gmAssistantActions').textContent=a.assistant.actions.slice(0,maxUnlockedActions(sessionPairLevel)).map(x=>x.name).join(' / ')||'—';

const API_BASE = 'https://trpg-character-app-api.yukituguakane.workers.dev';
async function loadCharacters() {
  try {
    const response = await fetch(`${API_BASE}/api/characters`);
    const data = await response.json();
    if (!response.ok || !data.ok || !Array.isArray(data.characters)) {
      throw new Error(data.error || 'キャラクターを読み込めませんでした。');}
    for (const record of data.characters) {
      const current = characters[record.id];
      if (!current) continue;
      Object.assign(current, record);
      // シートの入れ物は、既存の初期値を維持する
      current.detective = {
        ...current.detective,
        ...(record.detective || {})};
      current.assistant = {...current.assistant,
        ...(record.assistant || {})};
      current.commonSkills = {
        ...current.commonSkills,
        ...(record.commonSkills || {}) };
      current.classSkillRules = {
        ...current.classSkillRules,
        ...(record.classSkillRules || {})};
      current.assistant.stress =
        record.assistant?.stress ?? record.stress ?? 0;
      if (!Array.isArray(current.strongFeelings)) {

    fillGMSelects();
    renderSelection();
    setRole('d');
    setMode('view');
    setPage('select');  }
  catch (error) {

loadCharacters();
